# =============================================================================
# MangoWM binds — Super primary, vim focus, fuzzel
# Super        = everyday
# Super+Shift  = move / extra
# Super+Ctrl   = tags / layout / system
# Super+Alt    = monitors / rare
#
# Hardware XF86 keys: binds (keysym) + spawn_shell so they match and run
# the same as a terminal command. Session/notify/screenshot/lock via DMS.
# =============================================================================

# --- Session -----------------------------------------------------------------
#bind=SUPER,r,spawn_shell,fish ~/.config/mango/scripts/config_check.fish
bind=SUPER,r,reload_config
bind=SUPER+SHIFT,q,killclient
bind=SUPER+SHIFT,e,quit
bind=SUPER,x,spawn_shell,dms ipc call powermenu toggle

# --- Apps --------------------------------------------------------------------
bind=SUPER,Return,spawn,ghostty
bind=SUPER+CTRL,Return,spawn,ghostty -e yazi
bind=SUPER,space,spawn,fuzzel
bind=SUPER+SHIFT,space,spawn,fuzzel --dmenu
bind=SUPER,comma,spawn_shell,dms ipc call settings focusOrToggle
bind=SUPER+SHIFT,m,spawn_shell,dms ipc call processlist focusOrToggle
bind=SUPER+SHIFT,v,spawn_shell,dms ipc call clipboard toggle

# --- Focus (vim) -------------------------------------------------------------
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Tab,overcircle,next
bind=SUPER+CTRL,Tab,togglejump
bind=SUPER,u,focuslast
bind=SUPER,n,focusstack,next

# --- Swap (vim) --------------------------------------------------------------
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# --- Move floating -----------------------------------------------------------
bind=SUPER+CTRL,h,movewin,-50,+0
bind=SUPER+CTRL,j,movewin,+0,+50
bind=SUPER+CTRL,k,movewin,+0,-50
bind=SUPER+CTRL,l,movewin,+50,+0

# --- Resize floating ---------------------------------------------------------
bind=SUPER+ALT,h,resizewin,-50,+0
bind=SUPER+ALT,j,resizewin,+0,+50
bind=SUPER+ALT,k,resizewin,+0,-50
bind=SUPER+ALT,l,resizewin,+50,+0

# --- Window state ------------------------------------------------------------
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,f,togglefakefullscreen
bind=SUPER,v,togglefloating
bind=SUPER,m,togglemaximizescreen
bind=SUPER,g,toggleglobal
bind=SUPER,o,toggleoverlay
bind=SUPER,i,minimized
bind=SUPER+SHIFT,i,restore_minimized
bind=SUPER,z,toggle_scratchpad

# --- Layouts -----------------------------------------------------------------
bind=SUPER,e,incnmaster,1
# was SUPER+SHIFT+e, which already quits the compositor
bind=SUPER+CTRL,e,incnmaster,-1
bind=SUPER,s,zoom
bind=SUPER+SHIFT,x,switch_proportion_preset,prev
bind=SUPER+CTRL,x,set_proportion,1.0
bind=SUPER+CTRL,s,dwindle_toggle_split_direction
bind=SUPER+CTRL,t,setlayout,tile
bind=SUPER+CTRL,c,setlayout,scroller
bind=SUPER+SHIFT,Tab,switch_layout
bind=SUPER+CTRL+SHIFT,h,scroller_stack,left
bind=SUPER+CTRL+SHIFT,j,scroller_stack,down
bind=SUPER+CTRL+SHIFT,k,scroller_stack,up
bind=SUPER+CTRL+SHIFT,l,scroller_stack,right

# --- Tags --------------------------------------------------------------------
# Super+Left/Right   view prev/next tag
# Super+Ctrl+arrows  view next occupied tag
# Super+Alt+arrows   send window to prev/next tag
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=SUPER+CTRL,Left,viewtoleft_have_client,0
bind=SUPER+CTRL,Right,viewtoright_have_client,0
bind=SUPER+ALT,Left,tagtoleft,0
bind=SUPER+ALT,Right,tagtoright,0

# Super+1-9          view tag
# Super+Shift+1-9    send window to tag
# Super+Ctrl+1-9     toggle tag on focused window
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+CTRL,1,toggletag,1
bind=SUPER+CTRL,2,toggletag,2
bind=SUPER+CTRL,3,toggletag,3
bind=SUPER+CTRL,4,toggletag,4
bind=SUPER+CTRL,5,toggletag,5
bind=SUPER+CTRL,6,toggletag,6
bind=SUPER+CTRL,7,toggletag,7
bind=SUPER+CTRL,8,toggletag,8
bind=SUPER+CTRL,9,toggletag,9

# Super+Alt+1-9      toggle viewing that tag without leaving current
bind=SUPER+ALT,1,toggleview,1
bind=SUPER+ALT,2,toggleview,2
bind=SUPER+ALT,3,toggleview,3
bind=SUPER+ALT,4,toggleview,4
bind=SUPER+ALT,5,toggleview,5
bind=SUPER+ALT,6,toggleview,6
bind=SUPER+ALT,7,toggleview,7
bind=SUPER+ALT,8,toggleview,8
bind=SUPER+ALT,9,toggleview,9

# --- Monitors ----------------------------------------------------------------
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Down,focusmon,down
bind=SUPER+CTRL+ALT,h,tagmon,left
bind=SUPER+CTRL+ALT,l,tagmon,right
bind=SUPER+CTRL+ALT,k,tagmon,up
bind=SUPER+CTRL+ALT,j,tagmon,down
bind=SUPER+CTRL+ALT,Left,tagmon,left
bind=SUPER+CTRL+ALT,Right,tagmon,right
bind=SUPER+CTRL+ALT,Up,tagmon,up
bind=SUPER+CTRL+ALT,Down,tagmon,down
bind=SUPER+SHIFT,d,spawn_shell,dms ipc outputs cycleProfile

# --- Gaps --------------------------------------------------------------------
bind=SUPER,equal,incgaps,1
bind=SUPER,minus,incgaps,-1
bind=SUPER+SHIFT,0,togglegaps

# --- Mouse / axis / gestures -------------------------------------------------
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER,btn_middle,set_proportion,0.5
mousebind=SUPER+CTRL,btn_left,minimized
mousebind=SUPER+CTRL,btn_right,killclient
mousebind=SUPER+CTRL,btn_middle,togglefullscreen
mousebind=SUPER+SHIFT,btn_middle,togglemaximizescreen,0
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER+CTRL,UP,focusdir,left
axisbind=SUPER+CTRL,DOWN,focusdir,right
axisbind=SUPER+SHIFT,UP,exchange_client,left
axisbind=SUPER+SHIFT,DOWN,exchange_client,right
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview,1
gesturebind=none,down,4,toggleoverview,1

# --- Hardware keys -----------------------------------------------------------
# binds = match keysym (XF86 keys often fail as keycodes)
# spawn_shell = same argv as a terminal
binds=NONE,XF86AudioRaiseVolume,spawn_shell,dms ipc call audio increment 5
binds=NONE,XF86AudioLowerVolume,spawn_shell,dms ipc call audio decrement 5
binds=NONE,XF86AudioMute,spawn_shell,dms ipc call audio mute
binds=NONE,XF86AudioMicMute,spawn_shell,dms ipc call audio micmute
binds=NONE,XF86AudioPlay,spawn_shell,dms ipc call mpris playPause
binds=NONE,XF86AudioPause,spawn_shell,dms ipc call mpris playPause
binds=NONE,XF86AudioPrev,spawn_shell,dms ipc call mpris previous
binds=NONE,XF86AudioNext,spawn_shell,dms ipc call mpris next
binds=NONE,XF86MonBrightnessUp,spawn_shell,dms ipc call brightness increment 5 backlight:amdgpu_bl1
binds=NONE,XF86MonBrightnessDown,spawn_shell,dms ipc call brightness decrement 5 backlight:amdgpu_bl1

# If this raises volume but laptop keys do not, wev the key and use code:NNN
bind=SUPER+SHIFT,equal,spawn_shell,dms ipc call audio increment 5

# --- Utilities ---------------------------------------------------------------
bind=SUPER,b,spawn_shell,dms ipc call bar toggle index 0
bind=SUPER+SHIFT,Escape,spawn_shell,dms ipc call lock lock
#bind=SUPER+ALT,l,spawn_shell,dms ipc call lock lock
bind=SUPER,p,spawn_shell,fish ~/.config/mango/scripts/monitor.fish
bind=SUPER+SHIFT,p,spawn_shell,fish ~/.config/mango/scripts/virmon.fish
bind=NONE,Print,spawn_shell,dms screenshot
bind=CTRL,Print,spawn_shell,dms screenshot full
bind=ALT,Print,spawn_shell,dms screenshot window
bind=SUPER+SHIFT,s,spawn_shell,dms screenshot
bind=SUPER,grave,spawn_shell,dms ipc call notifications toggle
bind=SUPER+SHIFT,grave,spawn_shell,dms ipc call notifications toggle
bind=SUPER+SHIFT,slash,spawn_shell,dms ipc call keybinds toggle mangowc